name: build-exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl pyinstaller
      - run: pyinstaller --onefile --windowed --name Zayavki main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Zayavki
          path: dist/Zayavki.exe
